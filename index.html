<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Listing Pro</title>
    <style>
        body { font-family: -apple-system, sans-serif; background: #f4f7f6; padding: 15px; margin: 0; }
        .container { max-width: 500px; margin: auto; }
        .header { text-align: center; padding: 20px 0; }
        .api-section { background: #333; color: white; padding: 15px; border-radius: 10px; margin-bottom: 20px; font-size: 0.8rem; }
        .item-block { background: white; padding: 20px; border-radius: 15px; margin-bottom: 20px; border: 1px solid #ddd; position: relative; }
        input[type="file"] { margin: 10px 0; }
        .preview-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 5px; margin: 10px 0; }
        .preview-grid img { width: 100%; height: 60px; object-fit: cover; border-radius: 5px; }
        button { width: 100%; padding: 15px; border-radius: 10px; border: none; font-weight: bold; cursor: pointer; margin-top: 10px; }
        .ai-btn { background: #8e44ad; color: white; font-size: 1rem; }
        .copy-box { background: #fff; padding: 15px; border-radius: 12px; margin-top: 15px; border-left: 5px solid #8e44ad; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        pre { white-space: pre-wrap; font-size: 0.9rem; margin-top: 10px; }
        .loading { display: none; color: #8e44ad; text-align: center; font-weight: bold; margin: 10px; }
    </style>
</head>
<body>

<div class="container">
    <div class="header"><h2>AI Listing Assistant</h2></div>

    <div class="api-section">
        <label>Enter Gemini API Key:</label>
        <input type="password" id="apiKey" placeholder="Paste Key Here..." style="width:100%; padding:8px; margin-top:5px; border-radius:5px;">
        <p style="margin:5px 0 0; opacity:0.7;">Get a free key at aistudio.google.com</p>
    </div>

    <div id="items-container"></div>
    <button onclick="addItem()" style="background:#ddd;">+ Add Another Item</button>
</div>

<script>
    let itemCount = 0;

    function addItem() {
        itemCount++;
        const div = document.createElement('div');
        div.className = 'item-block';
        div.id = `block-${itemCount}`;
        div.innerHTML = `
            <h3>Item #${itemCount}</h3>
            <input type="file" id="files-${itemCount}" multiple accept="image/*" onchange="preview(${itemCount})">
            <div id="preview-${itemCount}" class="preview-grid"></div>
            <div id="loading-${itemCount}" class="loading">AI is analyzing photos... ⏳</div>
            <button class="ai-btn" onclick="runAI(${itemCount})">AI Generate Description</button>
            <div id="result-${itemCount}"></div>
        `;
        document.getElementById('items-container').appendChild(div);
    }

    function preview(id) {
        const grid = document.getElementById(`preview-${id}`);
        grid.innerHTML = "";
        Array.from(document.getElementById(`files-${id}`).files).slice(0, 8).forEach(file => {
            const reader = new FileReader();
            reader.onload = (e) => {
                const img = document.createElement('img');
                img.src = e.target.result;
                grid.appendChild(img);
            }
            reader.readAsDataURL(file);
        });
    }

    async function runAI(id) {
        const key = document.getElementById('apiKey').value;
        if (!key) return alert("Please enter an API key first!");

        const files = document.getElementById(`files-${id}`).files;
        if (files.length === 0) return alert("Upload some photos first!");

        document.getElementById(`loading-${id}`).style.display = 'block';

        try {
            // Convert first image to Base64
            const base64Data = await toBase64(files[0]);
            const pureBase64 = base64Data.split(',')[1];

            const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${key}`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    contents: [{
                        parts: [
                            { text: "Look at this clothing item. Identify the Brand, Item type, Colour, Size (if visible, otherwise guess based on fit), and Condition. Provide a 1-sentence description. Use this EXACT format:\n\nTitle: [Brand] [Item] [Colour] [Size] - sku\n\nColour: [Colour]\nSize: [Size]\nCondition: [Condition]\n\n🧼 Washed and ironed, ready to be worn!\n\n[small sentence about the item]\n\nSame day / Next day shipping!\nMessage me if you have any questions!\n#vintage #resell #streetwear #fashion #depop" },
                            { inline_data: { mime_type: "image/jpeg", data: pureBase64 } }
                        ]
                    }]
                })
            });

            const data = await response.json();
            const aiText = data.candidates[0].content.parts[0].text;
            
            document.getElementById(`result-${id}`).innerHTML = `
                <div class="copy-box">
                    <button onclick="copyThis(this)" style="background:#000; color:#fff; width:auto; padding:5px 10px; font-size:0.7rem; float:right;">Copy</button>
                    <pre>${aiText}</pre>
                </div>
            `;
        } catch (error) {
            alert("Error: Make sure your API key is correct.");
        }
        document.getElementById(`loading-${id}`).style.display = 'none';
    }

    const toBase64 = file => new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.readAsDataURL(file);
        reader.onload = () => resolve(reader.result);
        reader.onerror = error => reject(error);
    });

    function copyThis(btn) {
        navigator.clipboard.writeText(btn.nextElementSibling.innerText);
        btn.innerText = "Copied!";
        setTimeout(() => btn.innerText = "Copy", 2000);
    }

    addItem();
</script>

</body>
</html>
